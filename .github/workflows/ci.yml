name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests + static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest

      - name: Unit tests (pure layers — no GPU, no ComfyUI needed)
        run: python -m pytest tests/ -q

      - name: Python syntax check
        run: python -m compileall -q .

      - name: Verify the example workflow is structurally valid
        run: python tools/verify_workflow.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS widget syntax check
        run: node --check web/js/chaotic_director.js

      - name: JS widget smoke test (DOM-mocked constructor against a saved timeline)
        run: node tools/widget_smoke.js

      - name: JS widget — every this.X() call resolves to a class method
        run: |
          python - <<'EOF'
          import re, sys
          src = open('web/js/chaotic_director.js', encoding='utf-8').read()
          start = src.index('class ChaoticDirectorEditor')
          end = src.index('Extension registration')
          cls = src[start:end]
          methods = set(re.findall(r'^\s{2}(?:async\s+)?([A-Za-z_][A-Za-z0-9_]*)\(', cls, re.M))
          calls = set(re.findall(r'\bthis\.([A-Za-z_][A-Za-z0-9_]*)\(', cls))
          missing = sorted(c for c in calls if c not in methods)
          if missing:
              print('MISSING methods:', missing)
              sys.exit(1)
          print('all', len(calls), 'this.X() calls resolve to class methods')
          EOF
