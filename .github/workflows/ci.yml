name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests + static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install pytest

      - name: Unit tests (pure layers — no GPU, no ComfyUI needed)
        run: python -m pytest tests/ -q

      - name: Python syntax check
        run: python -m compileall -q .

      - name: Verify the example workflow is structurally valid
        run: python tools/verify_workflow.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JS widget syntax check
        run: node --check web/js/chaotic_director.js && node --check web/js/chaotic_puppet.js

      - name: JS widget smoke tests (DOM-mocked constructors against saved state)
        run: node tools/widget_smoke.js && node tools/puppet_smoke.js

      - name: JS widgets — every this.X() call resolves to a class method
        run: |
          python - <<'EOF'
          import re, sys
          failures = []
          def check_file(path, start_marker, end_marker, label):
              src = open(path, encoding='utf-8').read()
              start = src.index(start_marker)
              end = src.index(end_marker)
              cls = src[start:end]
              methods = set(re.findall(r'^\s{2}(?:async\s+)?([A-Za-z_][A-Za-z0-9_]*)\(', cls, re.M))
              calls = set(re.findall(r'\bthis\.([A-Za-z_][A-Za-z0-9_]*)\(', cls))
              missing = sorted(c for c in calls if c not in methods)
              if missing:
                  failures.append(label + ': ' + ', '.join(missing))
              else:
                  print(label, '- all', len(calls), 'this.X() calls resolve')
          check_file('web/js/chaotic_director.js', 'class ChaoticDirectorEditor', 'Extension registration', 'chaotic_director.js')
          check_file('web/js/chaotic_puppet.js', 'class ChaoticPuppetEditor', 'Extension registration', 'chaotic_puppet.js')
          if failures:
              print('MISSING methods:')
              for f in failures:
                  print(' -', f)
              sys.exit(1)
          EOF
