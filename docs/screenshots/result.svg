<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="860" height="430" rx="10" fill="#202020"/>
  <rect width="860" height="430" rx="10" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#161616"/>
  <rect x="0" y="18" width="860" height="16" fill="#161616"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="17" r="5" fill="#febc2e"/>
  <circle cx="50" cy="17" r="5" fill="#28c840"/>
  <text x="70" y="22" fill="#9a9a9a" font-size="12" font-weight="600">Rendered result — placeholder (replace with an exported clip or preview gif)</text>

  <!-- Film frame -->
  <rect x="30" y="54" width="800" height="320" rx="6" fill="#111" stroke="#333" stroke-width="1.5"/>

  <!-- Scene gradient (mocked dusk lot) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2438"/>
      <stop offset="0.55" stop-color="#4a2f3a"/>
      <stop offset="1" stop-color="#1c1616"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffb36b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="30" y="54" width="800" height="320" rx="6" fill="url(#sky)"/>
  <rect x="30" y="54" width="800" height="320" fill="url(#glow)"/>

  <!-- Mock silhouettes: S1 (left) and S2 (right) -->
  <g fill="#0d0a0a">
    <ellipse cx="250" cy="230" rx="52" ry="88"/>
    <circle cx="250" cy="132" r="30"/>
  </g>
  <g fill="#1a3a1a">
    <ellipse cx="600" cy="200" rx="78" ry="120"/>
    <circle cx="600" cy="72" r="46"/>
    <path d="M560 150 L640 150 L632 168 L568 168 Z"/>
  </g>
  <!-- ground -->
  <rect x="30" y="330" width="800" height="44" fill="#0d0d0d"/>
  <!-- vignette -->
  <rect x="30" y="54" width="800" height="320" fill="none" stroke="#000" stroke-width="6" opacity="0.55" rx="6"/>

  <!-- Play button -->
  <g transform="translate(430,214)">
    <circle r="34" fill="#000" opacity="0.55"/>
    <circle r="34" fill="none" stroke="#fff" stroke-width="2" opacity="0.85"/>
    <path d="M -10 -14 L 16 0 L -10 14 Z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Runtime bar -->
  <g>
    <rect x="60" y="352" width="220" height="5" rx="2.5" fill="#333"/>
    <rect x="60" y="352" width="110" height="5" rx="2.5" fill="#d47aa0"/>
    <text x="60" y="344" fill="#8a8a8a" font-size="10" font-family="ui-monospace, Menlo, monospace">00:00.0 / 00:10.5</text>
  </g>

  <!-- Stitch note -->
  <rect x="560" y="334" width="250" height="28" rx="5" fill="#161616" stroke="#2f7a50" stroke-width="1"/>
  <text x="572" y="352" fill="#7ee2a8" font-size="10.5" font-family="ui-monospace, Menlo, monospace">4 chunks · seams de-duped · audio muxed</text>

  <!-- Bottom hint -->
  <rect x="0" y="390" width="860" height="40" rx="10" fill="#1b1b1b"/>
  <rect x="0" y="408" width="860" height="22" fill="#1b1b1b"/>
  <text x="20" y="422" fill="#9a9a9a" font-size="11">One continuous video + audio clip from a chunked 8 GB-VRAM render.</text>
  <text x="700" y="422" fill="#555" font-size="10">docs/screenshots/result.svg</text>
</svg>
