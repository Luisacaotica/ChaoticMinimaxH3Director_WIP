<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="860" height="340" rx="10" fill="#202020"/>
  <rect width="860" height="340" rx="10" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="34" rx="10" fill="#161616"/>
  <rect x="0" y="18" width="860" height="16" fill="#161616"/>
  <circle cx="18" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="17" r="5" fill="#febc2e"/>
  <circle cx="50" cy="17" r="5" fill="#28c840"/>
  <text x="70" y="22" fill="#9a9a9a" font-size="12" font-weight="600">Chaotic H3 Director — timeline placeholder (replace with a real screenshot)</text>

  <!-- Ruler -->
  <rect x="0" y="34" width="860" height="26" fill="#1b1b1b"/>
  <g stroke="#4a4a4a" stroke-width="1">
    <line x1="0"   y1="60" x2="860" y2="60"/>
    <line x1="107" y1="52" x2="107" y2="60"/>
    <line x1="215" y1="48" x2="215" y2="60"/>
    <line x1="322" y1="52" x2="322" y2="60"/>
    <line x1="430" y1="44" x2="430" y2="60"/>
    <line x1="537" y1="52" x2="537" y2="60"/>
    <line x1="645" y1="48" x2="645" y2="60"/>
    <line x1="752" y1="52" x2="752" y2="60"/>
  </g>
  <g fill="#9a9a9a" font-size="10" font-family="ui-monospace, Menlo, monospace">
    <text x="111" y="46">1s</text>
    <text x="219" y="42">2s</text>
    <text x="326" y="46">3s</text>
    <text x="434" y="38">4s</text>
    <text x="541" y="46">5s</text>
    <text x="649" y="42">6s</text>
    <text x="756" y="46">7s</text>
  </g>

  <!-- Chunk boundary markers (dashed) -->
  <g stroke="#78beff" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.55">
    <line x1="430" y1="60" x2="430" y2="320"/>
  </g>
  <g fill="#ffd479">
    <rect x="427" y="58" width="6" height="6" rx="1"/>
  </g>

  <!-- Track lanes -->
  <g>
    <!-- Pictures / Subjects -->
    <rect x="0" y="60" width="860" height="60" fill="#2b3e36"/>
    <text x="8" y="74" fill="#ffffff" opacity="0.45" font-size="10" font-weight="600" letter-spacing="0.08em">PICTURES / SUBJECTS</text>
    <!-- subject block -->
    <rect x="24" y="72" width="300" height="36" rx="4" fill="#24332c" stroke="#4aa47f" stroke-width="1.5"/>
    <rect x="28" y="76" width="40" height="28" rx="3" fill="#33493f"/>
    <text x="34" y="94" fill="#e8e8e8" font-size="9">▣</text>
    <text x="76" y="94" fill="#e8e8e8" font-size="11" font-family="ui-monospace, Menlo, monospace">&lt;Picture 1&gt; · S1 reference</text>

    <!-- Videos -->
    <rect x="0" y="120" width="860" height="60" fill="#2b2f3e"/>
    <text x="8" y="134" fill="#ffffff" opacity="0.45" font-size="10" font-weight="600" letter-spacing="0.08em">VIDEOS</text>
    <rect x="24" y="132" width="240" height="36" rx="6" fill="#242a36" stroke="#5a7fd4" stroke-width="1.2"/>
    <text x="76" y="154" fill="#e8e8e8" font-size="11" font-family="ui-monospace, Menlo, monospace">&lt;Video 1&gt; · S2 motion</text>

    <!-- Audio -->
    <rect x="0" y="180" width="860" height="60" fill="#3e332b"/>
    <text x="8" y="194" fill="#ffffff" opacity="0.45" font-size="10" font-weight="600" letter-spacing="0.08em">AUDIO</text>
    <rect x="24" y="192" width="200" height="36" rx="2" fill="#362d26" stroke="#d49a5a" stroke-width="1.2"/>
    <g fill="#e0a86a">
      <rect x="34" y="210" width="3" height="6"/><rect x="40" y="204" width="3" height="12"/><rect x="46" y="200" width="3" height="16"/>
      <rect x="52" y="206" width="3" height="10"/><rect x="58" y="202" width="3" height="14"/><rect x="64" y="208" width="3" height="8"/>
      <rect x="70" y="204" width="3" height="12"/><rect x="76" y="200" width="3" height="16"/><rect x="82" y="206" width="3" height="10"/>
    </g>
    <text x="98" y="214" fill="#e8e8e8" font-size="11" font-family="ui-monospace, Menlo, monospace">&lt;Audio 1&gt; · sting.wav</text>

    <!-- Prompt track -->
    <rect x="0" y="240" width="860" height="60" fill="#3e2b33"/>
    <text x="8" y="254" fill="#ffffff" opacity="0.45" font-size="10" font-weight="600" letter-spacing="0.08em">PROMPT (shots)</text>
    <rect x="24" y="252" width="380" height="36" rx="4" fill="#2f2429" stroke="#d47aa0" stroke-width="1.5"/>
    <text x="34" y="266" fill="#e8dce2" font-size="11" font-family="ui-monospace, Menlo, monospace">[Shot 1] A tight two-shot…</text>
    <text x="34" y="281" fill="#8a7a82" font-size="10">3.5s</text>
    <rect x="440" y="252" width="180" height="36" rx="4" fill="#2f2429" stroke="#4a3a44" stroke-width="1"/>
    <text x="450" y="266" fill="#e8dce2" font-size="11" font-family="ui-monospace, Menlo, monospace">[Shot 2] Wide angle…</text>
    <text x="450" y="281" fill="#8a7a82" font-size="10">3.5s</text>
  </g>

  <!-- Bottom hint -->
  <rect x="0" y="300" width="860" height="40" rx="10" fill="#1b1b1b"/>
  <rect x="0" y="318" width="860" height="22" fill="#1b1b1b"/>
  <text x="20" y="324" fill="#7ee2a8" font-size="11" font-family="ui-monospace, Menlo, monospace">S1</text>
  <text x="44" y="324" fill="#9a9a9a" font-size="11">tags live-validated against the timeline · chunk cuts marked at 4s</text>
  <text x="700" y="324" fill="#555" font-size="10">docs/screenshots/timeline.svg</text>
</svg>
